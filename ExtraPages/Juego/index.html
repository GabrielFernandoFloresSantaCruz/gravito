<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID - Identity Reconstruction</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #game-container {
            border: 1px solid rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.05);
            border-radius: 4px;
        }
        canvas { display: block; border-radius: 4px; }
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }
        #loader.hidden { opacity: 0; pointer-events: none; }
        #loader-title {
            color: #ffffff;
            font-size: 72px;
            font-family: 'Courier New', monospace;
            letter-spacing: 8px;
            text-shadow: 0 0 40px rgba(0, 255, 255, 0.2);
        }
        #loader-sub {
            color: #00ffff;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            opacity: 0.6;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        #loader-bar {
            width: 300px;
            height: 2px;
            background: #1a1a2e;
            margin-top: 30px;
            overflow: hidden;
            border-radius: 2px;
        }
        #loader-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            animation: loading 2s ease-in-out infinite;
        }
        @keyframes loading {
            0% { width: 0%; }
            50% { width: 80%; }
            100% { width: 100%; }
        }
        #credits {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #1a1a2e;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            z-index: 50;
            pointer-events: none;
        }
        #credits span { color: #00ffff; opacity: 0.3; }
        @media (max-width: 768px) { #loader-title { font-size: 48px; } }
    </style>
</head>
<body>
    <div id="loader">
        <div id="loader-title">ID</div>
        <div id="loader-sub">INICIALIZANDO SISTEMA...</div>
        <div id="loader-bar"><div id="loader-progress"></div></div>
    </div>

    <div id="game-container"></div>
    <div id="credits"><span>✦</span> IDENTITY RECONSTRUCTION <span>✦</span></div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "./js/": "./js/"
            }
        }
    </script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
